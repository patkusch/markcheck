name: Something went wrong
description: markcheck did something you did not expect, or gave a wrong answer.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling me. Please leave out passwords, keys and anything private from what you paste below.
        If you found a security problem, do not post it here. Use the "Report a vulnerability" button on the Security tab instead.
  - type: textarea
    id: ran
    attributes:
      label: What did you do?
      description: The command you ran, or the steps you took.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead?
      description: Paste any error message as it appears.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: Your operating system, your Python or Node version, and the markcheck version or commit.
