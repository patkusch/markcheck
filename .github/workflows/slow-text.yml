name: Text check with the real models

# The slow tests load the two small language models the text check uses.
# They run once a week and on request, not on every push.
# The model files are kept in a cache, so they are downloaded only when the cache is empty.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only torch keeps the download small)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[text,dev]'
      - name: Keep the model files between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-smollm2-360m-v1
      - name: Fetch the model files if the cache is empty
        run: |
          python -c "from huggingface_hub import snapshot_download as d; [d(m) for m in ('HuggingFaceTB/SmolLM2-360M', 'HuggingFaceTB/SmolLM2-360M-Instruct')]"
      - name: Slow tests
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest -q -m slow
