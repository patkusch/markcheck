[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markcheck"
version = "0.1.0"
description = "Find AI labels in your files and explain in plain English what they do and don't prove."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "c2pa-python>=0.38",
  "Pillow>=10",
  "numpy>=1.24",
]

[project.optional-dependencies]
sd = ["invisible-watermark>=0.2.0"]
trustmark = ["trustmark>=0.9"]
all = ["invisible-watermark>=0.2.0", "trustmark>=0.9"]
dev = ["pytest>=8"]

[project.scripts]
markcheck = "markcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
markcheck = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
