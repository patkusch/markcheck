name: Compare a bigger model pair

# Scores a balanced sample of texts by newer AI models (and people's texts on the same
# topics) with the shipped model pair and with a bigger one, then compares how well
# each tells them apart. It runs on GitHub's machines, only when started by hand,
# so no laptop has to do the work. The result is shown on the run's page and kept
# as a downloadable file.

on:
  workflow_dispatch:
    inputs:
      observer:
        description: "Bigger pair: base model"
        default: "Qwen/Qwen2.5-1.5B"
      performer:
        description: "Bigger pair: chat model"
        default: "Qwen/Qwen2.5-1.5B-Instruct"
      limit:
        description: "How many texts to score (half AI, half people's)"
        default: "300"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ROWS: /home/runner/.cache/markcheck/textdata/newmodels/rows.jsonl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (CPU-only torch keeps the download small)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[text]' requests pyarrow
      - name: Keep the model files between runs
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-pairs-${{ inputs.observer }}-v1
      - name: Keep the newer-model texts between runs
        uses: actions/cache@v6
        with:
          path: ~/.cache/markcheck/textdata/newmodels
          key: newmodels-rows-v1
      - name: Fetch the newer-model texts (DetectRL-X and Beemo, both MIT), unless kept from last time
        run: test -s "$ROWS" || python -I scripts/text_fetch_newmodels.py
      - name: Score with the shipped pair
        run: |
          python scripts/text_compare_pairs.py HuggingFaceTB/SmolLM2-360M HuggingFaceTB/SmolLM2-360M-Instruct \
            --rows $ROWS --limit ${{ inputs.limit }} --name shipped
      - name: Score with the bigger pair
        run: |
          python scripts/text_compare_pairs.py "${{ inputs.observer }}" "${{ inputs.performer }}" \
            --rows $ROWS --limit ${{ inputs.limit }} --name bigger
      - name: Compare the two pairs
        run: |
          mkdir -p results
          python scripts/text_compare_pairs.py x x --rows $ROWS --limit ${{ inputs.limit }} \
            --name bigger --against shipped --report --json-out results/report.json | tee results/report.txt
          {
            echo "## Shipped pair vs ${{ inputs.observer }} pair"
            echo
            echo "Each number is the chance that a random AI text scores as more AI-like than a random person's text (0.5 is a coin toss)."
            echo
            echo '```'
            cat results/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp ~/.cache/markcheck/textdata/pair_*.jsonl results/
      - uses: actions/upload-artifact@v7
        with:
          name: bigger-pair-results
          path: results/
